<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crear Graffiti - B4W WALL</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Titan+One&family=Permanent+Marker&family=Monoton&display=swap" rel="stylesheet">
</head>
<body>
<header><a href="index.html">← Volver a la pared</a><h1>CREÁ TU GRAFFITI</h1></header>

<main class="editor">
  <canvas id="canvas" width="1080" height="1080" style="background:#7a3b2e; max-width:100%; width:500px; height:500px; border-radius:12px;"></canvas>

  <div class="controles">
    <input id="texto" type="text" maxlength="20" value="B4W">
    <input id="alias" type="text" maxlength="20" placeholder="Tu alias... ej: Marcelo">

    <label>Estilo</label>
    <select id="estilo">
      <option value="stencil">Stencil - Callejero</option>
      <option value="bubble">Bubble - Letras gordas</option>
      <option value="wildstyle">Wildstyle - Hip Hop</option>
      <option value="neon">Neón - Cartel</option>
      <option value="tag">Tag - Firma</option>
    </select>

    <label>Color principal</label>
    <input id="color1" type="color" value="#ff2d55">
    <label>Color secundario</label>
    <input id="color2" type="color" value="#ffd60a">

    <label>Fondo</label>
    <select id="fondo">
      <option value="ladrillo">Pared de ladrillo</option>
      <option value="hormigon">Hormigón</option>
      <option value="negro">Negro / Noche</option>
      <option value="chapa">Chapa</option>
    </select>

    <button id="btnPintar" class="btn-principal">PINTAR EN LA PARED</button>
    <button id="btnDescargar">Descargar para Historia (9:16)</button>
    <p id="debug" style="font-size:12px; opacity:0.7"></p>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// DIBUJO INLINE - no depende de app.js
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
document.getElementById('debug').textContent = "Canvas encontrado: " + !!canvas;

function dibujar() {
  const texto = (document.getElementById('texto').value || "B4W").toUpperCase();
  const estilo = document.getElementById('estilo').value;
  const color1 = document.getElementById('color1').value;
  const color2 = document.getElementById('color2').value;
  const fondo = document.getElementById('fondo').value;

  let bg = '#7a3b2e';
  if (fondo === 'hormigon') bg = '#555';
  if (fondo === 'negro') bg = '#000';
  if (fondo === 'chapa') bg = '#2b4a6f';
  ctx.fillStyle = bg;
  ctx.fillRect(0,0,1080,1080);

  ctx.strokeStyle = 'rgba(0,0,0,0.25)';
  for(let y=0; y<1080; y+=90){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(1080,y); ctx.stroke(); }

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.shadowBlur = 0;

  if (estilo === 'neon') {
    ctx.font = '110px Monoton, Arial'; ctx.shadowColor = color1; ctx.shadowBlur = 40;
    ctx.fillStyle = color1; ctx.fillText(texto, 540, 540); ctx.shadowBlur = 0;
  } else if (estilo === 'tag') {
    ctx.font = '160px "Permanent Marker", Arial'; ctx.fillStyle = color1;
    ctx.save(); ctx.translate(540,540); ctx.rotate(-0.08); ctx.fillText(texto, 0, 0); ctx.restore();
  } else if (estilo === 'bubble') {
    ctx.font = '140px "Titan One", Arial'; ctx.lineWidth = 20; ctx.strokeStyle = color2; ctx.lineJoin = 'round';
    ctx.strokeText(texto, 540, 540); ctx.fillStyle = color1; ctx.fillText(texto, 540, 540);
  } else {
    ctx.font = '130px "Black Ops One", Arial'; ctx.lineWidth = 10; ctx.strokeStyle = '#000';
    ctx.strokeText(texto, 540, 540); ctx.fillStyle = color1; ctx.fillText(texto, 540, 540);
    if (estilo === 'wildstyle') { ctx.font = '60px "Black Ops One", Arial'; ctx.fillStyle = color2; ctx.fillText('★ B4W ★', 540, 720); }
  }
  ctx.font = 'bold 30px Arial'; ctx.fillStyle = '#fff'; ctx.fillText('[B4W] WALL', 540, 1000);
  document.getElementById('debug').textContent = "Dibujado: " + texto + " | " + estilo + " | " + color1;
}

['texto','estilo','color1','color2','fondo'].forEach(id => {
  document.getElementById(id).addEventListener('input', dibujar);
});

dibujar();
document.fonts.ready.then(() => dibujar());
setTimeout(dibujar, 500);

// SUPABASE - solo para guardar
let supabaseClient = null;
try {
  const URL = "https://ciwjyflatveowadenini.supabase.co";
  const KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNpd2p5ZmxhdHZlb3dhZGVuaW5pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU1MzE5ODAsImV4cCI6MjExMTEwNzk4MH0.wswRXCIhm5ZIMdtvncfssZO_y6wUigjgMmTMVYxA1ic";
  if (URL.startsWith("http")) supabaseClient = window.supabase.createClient(URL, KEY);
} catch(e) { console.log(e); }

document.getElementById('btnPintar').addEventListener('click', async () => {
  if (!supabaseClient) return alert('Falta pegar tu URL y KEY de Supabase en crear.html (abajo, donde dice TU_SUPABASE_URL)');
  const { data, error } = await supabaseClient.from('graffitis').insert([{
    texto: document.getElementById('texto').value,
    estilo: document.getElementById('estilo').value,
    color1: document.getElementById('color1').value,
    color2: document.getElementById('color2').value,
    fondo: document.getElementById('fondo').value,
    autor_alias: document.getElementById('alias').value || 'Anónimo'
  }]).select().single();
  if (error) return alert('Error: ' + error.message);
  window.location.href = `graffiti.html?id=${data.id}`;
});

document.getElementById('btnDescargar').addEventListener('click', () => {
  const a = document.createElement('a'); a.download = 'mi-graffiti-b4w.png'; a.href = canvas.toDataURL('image/png'); a.click();
});
</script>
</body>
</html>

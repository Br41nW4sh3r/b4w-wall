<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Graffiti - B4W</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;800&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',sans-serif;background:#0a0a0a;color:#fff;min-height:100vh;text-align:center}
  header{padding:24px 20px;max-width:800px;margin:0 auto}
  .back{color:#a855f7;text-decoration:none;font-size:14px}
  .logo{font-family:'Bebas Neue',sans-serif;font-size:42px;margin-top:10px}
  .logo span{color:#ff2d55}
  .box{max-width:800px;margin:0 auto;padding:0 20px 40px}
  #wall{width:100%;max-width:650px;margin:20px auto;border-radius:16px;height:380px;background-image:url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=1000&q=80');background-size:cover;background-position:center;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;position:relative}
  #wallText{font-family:'Permanent Marker',cursive;font-size:54px;color:#000;line-height:1;word-break:break-word;text-shadow:2px 2px 0 rgba(255,255,255,0.2)}
  #estiloBadge{margin-top:14px;background:rgba(0,0,0,0.6);padding:6px 14px;border-radius:999px;font-size:13px}
  #autor{font-size:22px;font-weight:800;margin-top:20px}
  #fecha{opacity:0.6;margin-top:8px}
  .row{display:flex;gap:12px;justify-content:center;margin-top:20px}
  .row button,.row a{padding:14px 20px;border-radius:12px;border:none;font-weight:700;cursor:pointer;text-decoration:none;font-size:14px}
  .btn-down{background:#1a1a1a;color:#fff;flex:1}
  .btn-share{background:#22c55e;color:#000;flex:1}
  .btn-mini{background:#1a1a1a;color:#fff;padding:12px 16px;border-radius:12px}
  #btnPintar{background:#ff2d55;color:#fff;padding:14px 24px;border-radius:12px;border:none;font-weight:800;margin-top:20px;cursor:pointer}
  #loading{padding:60px;opacity:0.6}
</style>
</head>
<body>
<header><a class="back" href="index.html">← Volver a la pared</a><div class="logo">[B4W] <span>WALL</span></div></header>
<div class="box">
  <div id="loading">Cargando graffiti...</div>
  <div id="content" style="display:none">
    <div id="wall"><div id="wallText"></div><div id="estiloBadge"></div></div>
    <div id="autor"></div>
    <div id="fecha"></div>
    <div class="row">
      <button class="btn-down" id="btnDown">⬇ Descargar foto</button>
      <button class="btn-share" id="btnShare">📤 Compartir foto</button>
    </div>
    <div class="row">
      <a class="btn-mini" id="btnWa" target="_blank" href="#">WhatsApp (link)</a>
      <a class="btn-mini" id="btnX" target="_blank" href="#">X</a>
      <a class="btn-mini" id="btnFb" target="_blank" href="#">Facebook</a>
      <button class="btn-mini" id="btnCopy">Copiar Link</button>
    </div>
    <button id="btnPintar" onclick="window.location.href='crear.html'">Pintar el mío también</button>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script>
const SUPABASE_URL = "https://ciwjyflatveowadenini.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNpd2p5ZmxhdHZlb3dhZGVuaW5pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU1MzE5ODAsImV4cCI6MjExMTEwNzk4MH0.wswRXCIhm5ZIMdtvncfssZO_y6wUigjgMmTMVYxA1ic";

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let current=null;
async function cargar(){
  const id=new URLSearchParams(window.location.search).get('id')||'';
  if(!/^[0-9a-fA-F-]{36}$/.test(id)){ document.getElementById('loading').textContent='Este graffiti no existe.'; return; }
  const { data, error } = await supabaseClient.from('graffitis').select('*').eq('id', id).single();
  if(error||!data){ document.getElementById('loading').textContent='Este graffiti no existe.'; return; }
  current=data;
  document.getElementById('loading').style.display='none';
  document.getElementById('content').style.display='block';
  document.getElementById('wallText').textContent=data.texto||'';
  document.getElementById('wallText').style.color=data.color1||'#000';
  document.getElementById('estiloBadge').textContent='Estilo: '+(data.estilo||'tag')+' • ladrillo';
  document.getElementById('autor').textContent='por '+(data.author||'marcelo');
  document.getElementById('fecha').textContent=data.created_at?new Date(data.created_at).toLocaleString('es-AR'):'';
  document.getElementById('btnWa').href='https://wa.me/?text='+encodeURIComponent('Mirá este graffiti: '+window.location.href);
  document.getElementById('btnX').href='https://twitter.com/intent/tweet?text='+encodeURIComponent('Mirá este graffiti: '+window.location.href);
  document.getElementById('btnFb').href='https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(window.location.href);
  document.getElementById('btnCopy').onclick=()=>{ navigator.clipboard.writeText(window.location.href); alert('Link copiado'); };
}
async function descargar(){
  if(!current) return;
  const canvas=await html2canvas(document.getElementById('wall'),{useCORS:true});
  const a=document.createElement('a'); a.download='b4w-graffiti.png'; a.href=canvas.toDataURL('image/png'); a.click();
}
document.getElementById('btnDown').onclick=descargar;
document.getElementById('btnShare').onclick=async ()=>{
  try{
    const canvas=await html2canvas(document.getElementById('wall'),{useCORS:true});
    canvas.toBlob(async (blob)=>{
      const file=new File([blob],'b4w.png',{type:'image/png'});
      if(navigator.share){ await navigator.share({files:[file], title:'B4W'}); }
      else descargar();
    });
  }catch(e){ descargar(); }
};
cargar();
</script>
</body>
</html>

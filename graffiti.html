<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Graffiti - B4W</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',sans-serif;background:#0a0a0a;color:#fff;min-height:100vh}
  header{padding:24px 20px;display:flex;justify-content:space-between;align-items:center;max-width:800px;margin:0 auto}
  .logo{font-family:'Bebas Neue',sans-serif;font-size:32px}
  .logo span{color:#ff2d55}
  .back{color:#fff;opacity:0.7;text-decoration:none;font-size:14px}
  .box{max-width:800px;margin:0 auto;padding:0 20px 40px}
  #foto{width:100%;border-radius:16px;max-height:520px;object-fit:cover;background:#222;display:none}
  #textoGrande{width:100%;border-radius:16px;padding:60px 20px;text-align:center;font-family:'Bebas Neue',sans-serif;font-size:56px;line-height:1;display:none}
  h1{font-family:'Bebas Neue',sans-serif;font-size:48px;margin:18px 0 6px;word-break:break-word}
  #autor{opacity:0.6;margin-bottom:14px}
  #desc{line-height:1.6;opacity:0.85;white-space:pre-wrap;word-break:break-word}
  #loading{text-align:center;padding:60px;opacity:0.6}
  .share{margin-top:24px;display:flex;gap:10px}
  .share a{flex:1;text-align:center;padding:12px;border-radius:999px;text-decoration:none;font-weight:700;font-size:14px}
  .wa{background:#25D366;color:#000}
  .ig{background:#fff;color:#000}
</style>
</head>
<body>
<header>
  <div class="logo">B4W<span>.</span></div>
  <a class="back" href="index.html">← Volver a la pared</a>
</header>
<div class="box">
  <div id="loading">Cargando graffiti...</div>
  <div id="content" style="display:none">
    <img id="foto" alt="">
    <div id="textoGrande"></div>
    <h1 id="titulo"></h1>
    <p id="autor"></p>
    <p id="desc"></p>
    <div class="share">
      <a class="wa" id="btnWa" target="_blank" href="#">Compartir en WhatsApp</a>
      <a class="ig" href="index.html">Ver pared</a>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://ciwjyflatveowadenini.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNpd2p5ZmxhdHZlb3dhZGVuaW5pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU1MzE5ODAsImV4cCI6MjExMTEwNzk4MH0.wswRXCIhm5ZIMdtvncfssZO_y6wUigjgMmTMVYxA1ic";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
async function cargar(){
  const params = new URLSearchParams(window.location.search);
  const idRaw = params.get('id') || '';
  const id = /^[0-9a-fA-F-]{36}$/.test(idRaw) ? idRaw : null;
  const loading = document.getElementById('loading');
  if(!id){ loading.textContent='Este graffiti no existe.'; return; }
  try{
    const { data, error } = await supabaseClient.from('graffitis').select('*').eq('id', id).single();
    if(error || !data){ loading.textContent='Este graffiti no existe.'; return; }
    loading.style.display='none';
    document.getElementById('content').style.display='block';
    const titulo = data.title || data.texto || 'Sin título';
    if(data.image_url){
      const foto = document.getElementById('foto');
      foto.src = data.image_url; foto.style.display='block';
    } else {
      const tg = document.getElementById('textoGrande');
      tg.textContent = titulo;
      tg.style.background = data.color1 || '#1a1a1a';
      tg.style.display='block';
    }
    document.getElementById('titulo').textContent = titulo;
    document.getElementById('autor').textContent = (data.author || 'Anónimo') + ' • ' + (data.created_at ? new Date(data.created_at).toLocaleDateString('es-AR') : '');
    document.getElementById('desc').textContent = data.description || '';
    document.getElementById('btnWa').href = 'https://wa.me/?text=' + encodeURIComponent('Mirá este graffiti en B4W: ' + window.location.href);
  }catch(e){ console.error(e); loading.textContent='Error cargando graffiti.'; }
}
cargar();
</script>
</body>
</html>

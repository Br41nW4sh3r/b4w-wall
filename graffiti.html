<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Graffiti - B4W WALL</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Titan+One&family=Permanent+Marker&family=Monoton&display=swap" rel="stylesheet">
<style>
  .graffiti-detalle{max-width:600px;margin:0 auto;padding:20px;text-align:center}
  .graffiti-cuadro{border-radius:16px;padding:40px 20px;min-height:320px;display:flex;flex-direction:column;justify-content:center;align-items:center;background-size:cover;background-position:center top;overflow:hidden}
  .graffiti-texto{font-size:56px;line-height:1.1;word-break:break-word;opacity:.95}
  .share-box{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:20px}
  .share-box a,.share-box button{background:#222;color:#fff;padding:12px 18px;border-radius:10px;text-decoration:none;border:none;cursor:pointer}
  .share-box a.whatsapp{background:#25D366;color:#000;font-weight:bold}
  .share-foto{display:flex;gap:10px;justify-content:center;margin-top:12px}
  .share-foto button{flex:1;padding:14px;border-radius:12px;border:none;font-weight:bold;cursor:pointer}
  #btnDescargarFoto{background:#222;color:#fff}
  #btnCompartirFoto{background:#25D366;color:#000}
</style>
</head>
<body>
<header><a href="index.html">← Volver a la pared</a><h1>[B4W] <span>WALL</span></h1></header>
<main class="graffiti-detalle">
  <div id="loading">Cargando graffiti...</div>
  <div id="contenido" style="display:none">
    <div id="cuadro" class="graffiti-cuadro"><div id="textoGraffiti" class="graffiti-texto"></div><div id="estiloGraffiti" style="margin-top:15px;background:rgba(0,0,0,.55);padding:4px 10px;border-radius:10px;color:#fff"></div></div>
    <h2 id="autor"></h2><p id="fecha"></p>
    <div class="share-foto">
      <button id="btnDescargarFoto">⬇ Descargar foto</button>
      <button id="btnCompartirFoto">📲 Compartir foto</button>
    </div>
    <div class="share-box"><a id="btnWA" class="whatsapp" target="_blank">WhatsApp (link)</a><a id="btnX" target="_blank">X</a><a id="btnFB" target="_blank">Facebook</a><button id="btnCopiar">Copiar Link</button></div><br><a href="crear.html" class="btn-principal">Pintar el mío también</a>
    <canvas id="canvasOculto" width="1080" height="1080" style="display:none"></canvas>
  </div>
  <div id="error" style="display:none"><p>Este graffiti no existe.</p><a href="index.html" class="btn-principal">Ir a la pared</a></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const id = new URLSearchParams(location.search).get('id');
if (!id) { document.getElementById('loading').style.display='none'; document.getElementById('error').style.display='block'; }
const SUPABASE_URL = "https://ciwjyflatveowadenini.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNpd2p5ZmxhdHZlb3dhZGVuaW5pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU1MzE5ODAsImV4cCI6MjExMTEwNzk4MH0.wswRXCIhm5ZIMdtvncfssZO_y6wUigjgMmTMVYxA1ic";
const FUENTES = { stencil:'Black Ops One', bubble:'Titan One', wildstyle:'Black Ops One', neon:'Monoton', tag:'Permanent Marker' };
const FONDOS = { ladrillo:'ladrillo.jpg', hormigon:'hormigon.jpg', negro:'negro.jpg', chapa:'chapa.jpg' };
const FONDOS_CROP = { ladrillo:0.72, hormigon:0.88, negro:1, chapa:1 };
let datos = null;
let canvasListo = false;

function generarImagen() {
  return new Promise((resolve) => {
    const canvas = document.getElementById('canvasOculto');
    const ctx = canvas.getContext('2d');
    const img = new Image(); img.src = FONDOS[datos.fondo] || FONDOS.ladrillo;
    img.onload = () => {
      const cropH = FONDOS_CROP[datos.fondo] || 1;
      ctx.drawImage(img, 0, 0, img.width, img.height * cropH, 0, 0, 1080, 1080);
      // mismo dibujo que en crear.html
      const texto = datos.texto; const estilo = datos.estilo;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      let lineas = [texto]; let size = 130;
      if (texto.length > 12) { size = 95; lineas = [texto.slice(0, Math.ceil(texto.length/2)), texto.slice(Math.ceil(texto.length/2))]; }
      if (texto.length > 20) size = 75;
      ctx.font = `${size}px '${FUENTES[estilo]}', sans-serif`;
      ctx.globalAlpha = 0.94;
      lineas.forEach((linea, i) => {
        const y = lineas.length === 1 ? 540 : 540 - 70 + i * 140;
        if (estilo === 'neon') { ctx.shadowColor = datos.color1; ctx.shadowBlur = 35; ctx.fillStyle = datos.color1; ctx.fillText(linea, 540, y); ctx.shadowBlur = 12; ctx.fillStyle = '#fff'; ctx.fillText(linea, 540, y); ctx.shadowBlur = 0; }
        else if (estilo === 'bubble') { ctx.lineWidth = 10; ctx.strokeStyle = datos.color2; ctx.strokeText(linea, 540, y); ctx.fillStyle = datos.color1; ctx.fillText(linea, 540, y); }
        else if (estilo === 'tag') { ctx.save(); ctx.translate(540, y); ctx.rotate(-0.06); ctx.fillStyle = datos.color1; ctx.fillText(linea, 0, 0); ctx.restore(); }
        else { ctx.lineWidth = 7; ctx.strokeStyle = 'rgba(0,0,0,0.85)'; ctx.strokeText(linea, 540, y); ctx.fillStyle = datos.color1; ctx.fillText(linea, 540, y); }
      });
      ctx.globalAlpha = 1; canvasListo = true; resolve(canvas);
    };
  });
}
async function cargar(){
  try{
    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const { data, error } = await client.from('graffitis').select('*').eq('id', id).single();
    if (error || !data) throw new Error("no data");
    datos = data;
    document.getElementById('loading').style.display='none';
    document.getElementById('contenido').style.display='block';
    const cuadro = document.getElementById('cuadro');
    cuadro.style.backgroundImage = `url(${FONDOS[data.fondo] || FONDOS.ladrillo})`;
    cuadro.style.color = data.color1;
    const txt = document.getElementById('textoGraffiti');
    txt.textContent = data.texto;
    txt.style.fontFamily = `'${FUENTES[data.estilo]}', sans-serif`;
    txt.style.mixBlendMode = data.fondo === 'negro' ? 'normal' : 'multiply';
    document.getElementById('estiloGraffiti').textContent = `Estilo: ${data.estilo} • ${data.fondo}`;
    document.getElementById('autor').textContent = `por ${data.autor_alias}`;
    document.getElementById('fecha').textContent = new Date(data.created_at).toLocaleString('es-AR');
    const url = location.href;
    const mensaje = `Mirá mi graffiti "${data.texto}" en B4W WALL ${url}`;
    document.getElementById('btnWA').href = `https://wa.me/?text=${encodeURIComponent(mensaje)}`;
    document.getElementById('btnX').href = `https://twitter.com/intent/tweet?text=${encodeURIComponent(mensaje)}`;
    document.getElementById('btnFB').href = `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}`;
    document.getElementById('btnCopiar').onclick = () => { navigator.clipboard.writeText(url); alert('Link copiado'); };
    document.fonts.ready.then(() => generarImagen());
  } catch(e){ document.getElementById('loading').style.display='none'; document.getElementById('error').style.display='block'; }
}
if (id) cargar();
document.getElementById('btnDescargarFoto').onclick = async () => {
  const canvas = await generarImagen();
  const a = document.createElement('a');
  a.download = `b4w-${datos.texto.toLowerCase().replace(/[^a-z0-9]+/g,'-')}.jpg`;
  a.href = canvas.toDataURL('image/jpeg', 0.92); a.click();
};
document.getElementById('btnCompartirFoto').onclick = async () => {
  const canvas = await generarImagen();
  canvas.toBlob(async (blob) => {
    const file = new File([blob], 'b4w-graffiti.jpg', { type: 'image/jpeg' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: 'B4W WALL', text: `Mirá mi graffiti "${datos.texto}" en B4W WALL` }); return; } catch(e) {}
    }
    const a = document.createElement('a'); a.download = 'b4w-graffiti.jpg'; a.href = URL.createObjectURL(blob); a.click();
    alert('Tu navegador no deja compartir foto directo. Te la descargué, mandala desde WhatsApp como foto.');
  }, 'image/jpeg', 0.92);
};
</script>
</body>
</html>

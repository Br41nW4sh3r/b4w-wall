<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B4W WALL</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;800&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',sans-serif;background:#0a0a0a;color:#fff;min-height:100vh}
  header{padding:24px 20px;display:flex;justify-content:space-between;align-items:center;max-width:1200px;margin:0 auto}
  .logo{font-family:'Bebas Neue',sans-serif;font-size:42px}
  .logo span{color:#ff2d55}
  .btn-crear{background:#ff2d55;color:#fff;padding:12px 20px;border-radius:999px;text-decoration:none;font-weight:800;font-size:14px}
  .hero{text-align:center;padding:10px 20px 20px}
  .hero h1{font-family:'Bebas Neue',sans-serif;font-size:64px;line-height:0.9}
  .hero h1 span{color:#ff2d55}
  #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;max-width:1200px;margin:0 auto;padding:20px}
  .card{background:#1a1a1a;border-radius:16px;overflow:hidden;text-decoration:none;color:#fff;display:block}
  .card-wall{width:100%;height:220px;background-image:url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=800&q=80');background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center}
  .card-wall span{font-family:'Permanent Marker',cursive;font-size:32px;line-height:1.1;text-shadow:2px 2px 0 rgba(0,0,0,0.4);word-break:break-word}
  .card-body{padding:14px 16px}
  .card-body h3{font-size:15px}
  .card-body p{font-size:13px;opacity:0.6}
  #loading{text-align:center;padding:40px;opacity:0.6}
</style>
</head>
<body>
<header><div class="logo">[B4W] <span>WALL</span></div><a class="btn-crear" href="crear.html">+ Pintar el mío</a></header>
<div class="hero"><h1>LA PARED<br><span>ES TUYA</span></h1></div>
<div id="loading">Cargando pared...</div>
<div id="grid"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://ciwjyflatveowadenini.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNpd2p5ZmxhdHZlb3dhZGVuaW5pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU1MzE5ODAsImV4cCI6MjExMTEwNzk4MH0.wswRXCIhm5ZIMdtvncfssZO_y6wUigjgMmTMVYxA1ic";

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
async function cargar(){
  const grid=document.getElementById('grid');
  const loading=document.getElementById('loading');
  const { data, error } = await supabaseClient.from('graffitis').select('*').order('created_at',{ascending:false});
  loading.style.display='none';
  if(error){ loading.textContent='Error'; return; }
  grid.innerHTML='';
  data.forEach(g=>{
    const a=document.createElement('a'); a.className='card'; a.href='graffiti.html?id='+encodeURIComponent(g.id);
    const wall=document.createElement('div'); wall.className='card-wall';
    const s=document.createElement('span'); s.textContent=g.texto||'';
    s.style.color=g.color1||'#000';
    wall.appendChild(s);
    const body=document.createElement('div'); body.className='card-body';
    const h3=document.createElement('h3'); h3.textContent=g.texto||'';
    const p=document.createElement('p'); p.textContent='por '+(g.author||'marcelo')+' • '+(g.estilo||'tag');
    body.appendChild(h3); body.appendChild(p);
    a.appendChild(wall); a.appendChild(body);
    grid.appendChild(a);
  });
}
cargar();
</script>
</body>
</html>

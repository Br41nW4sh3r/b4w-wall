<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B4W - La Pared</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',sans-serif;background:#0a0a0a;color:#fff;min-height:100vh}
  header{padding:24px 20px;display:flex;justify-content:space-between;align-items:center;max-width:1200px;margin:0 auto}
  .logo{font-family:'Bebas Neue',sans-serif;font-size:42px;letter-spacing:2px}
  .logo span{color:#ff2d55}
  .btn-crear{background:#ff2d55;color:#fff;padding:12px 20px;border-radius:999px;text-decoration:none;font-weight:800;font-size:14px}
  .hero{text-align:center;padding:20px 20px 30px}
  .hero h1{font-family:'Bebas Neue',sans-serif;font-size:64px;line-height:0.9;letter-spacing:1px}
  .hero h1 span{color:#ff2d55}
  .hero p{opacity:0.7;margin-top:10px}
  #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;max-width:1200px;margin:0 auto;padding:20px}
  .card{background:#1a1a1a;border-radius:16px;overflow:hidden;text-decoration:none;color:#fff;display:block}
  .card img{width:100%;height:220px;object-fit:cover;display:block;background:#222}
  .card-text{width:100%;height:220px;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center;font-family:'Bebas Neue',sans-serif;font-size:38px;line-height:1}
  .card-body{padding:14px 16px}
  .card-body h3{font-size:16px;margin-bottom:4px;word-break:break-word}
  .card-body p{font-size:13px;opacity:0.6;word-break:break-word}
  #loading{text-align:center;padding:40px;opacity:0.6}
  #empty{text-align:center;padding:40px;opacity:0.6;display:none}
  #empty a{color:#ff2d55}
</style>
</head>
<body>
<header>
  <div class="logo">B4W<span>.</span></div>
  <a class="btn-crear" href="crear.html">+ Crear graffiti</a>
</header>
<div class="hero">
  <h1>LA PARED<br><span>ES TUYA</span></h1>
  <p>Subí tu graffiti. Que lo vea todo el barrio.</p>
</div>
<div id="loading">Cargando pared...</div>
<div id="empty">Todavía no hay graffitis. <a href="crear.html">Sé el primero</a></div>
<div id="grid"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://ciwjyflatveowadenini.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNpd2p5ZmxhdHZlb3dhZGVuaW5pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU1MzE5ODAsImV4cCI6MjExMTEwNzk4MH0.wswRXCIhm5ZIMdtvncfssZO_y6wUigjgMmTMVYxA1ic";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
async function cargar(){
  const grid = document.getElementById('grid');
  const loading = document.getElementById('loading');
  const empty = document.getElementById('empty');
  try{
    const { data, error } = await supabaseClient.from('graffitis').select('*').order('created_at',{ascending:false});
    loading.style.display='none';
    if(error) throw error;
    if(!data || data.length===0){ empty.style.display='block'; return; }
    grid.innerHTML='';
    data.forEach(g=>{
      if(!/^[0-9a-fA-F-]{36}$/.test(String(g.id))) return;
      const titulo = g.title || g.texto || 'Sin título';
      const a = document.createElement('a');
      a.className='card';
      a.href='graffiti.html?id='+encodeURIComponent(g.id);
      if(g.image_url){
        const img = document.createElement('img');
        img.src=g.image_url; img.alt=''; img.loading='lazy';
        a.appendChild(img);
      } else {
        const div = document.createElement('div');
        div.className='card-text';
        div.style.background = g.color1 || '#1a1a1a';
        div.textContent = titulo;
        a.appendChild(div);
      }
      const body = document.createElement('div');
      body.className='card-body';
      const h3 = document.createElement('h3');
      h3.textContent = titulo;
      const p = document.createElement('p');
      const fecha = g.created_at ? new Date(g.created_at).toLocaleDateString('es-AR') : '';
      p.textContent = (g.author || 'Anónimo') + (fecha ? ' • ' + fecha : '');
      body.appendChild(h3); body.appendChild(p);
      a.appendChild(body);
      grid.appendChild(a);
    });
  }catch(e){ loading.textContent='Error cargando pared. Recargá.'; console.error(e); }
}
cargar();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>[B4W] WALL - La pared es de todos</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Titan+One&family=Permanent+Marker&family=Monoton&display=swap" rel="stylesheet">
<style>
  .filtros{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:25px 0}
  .filtros button{background:#222;color:#fff;border:1px solid #444;padding:8px 16px;border-radius:20px;cursor:pointer}
  .filtros button.activo{background:#ff2a4d;border-color:#ff2a4d}
  #pared{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;padding:0 20px 40px;max-width:1100px;margin:0 auto}
  .card{border-radius:14px;padding:30px 15px;min-height:180px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-decoration:none;color:inherit;cursor:pointer}
  .card-texto{font-size:32px;line-height:1;word-break:break-word;text-align:center}
  .card-autor{margin-top:12px;font-size:13px;opacity:.9}
</style>
</head>
<body>
<header><h1>[B4W] <span>WALL</span></h1><p>La pared es de todos. Pintá algo, que quede en la historia.</p><a href="crear.html" class="btn-principal">+ PINTAR MI GRAFFITI</a></header>

<div class="filtros">
  <button data-f="todos" class="activo">Todos</button>
  <button data-f="stencil">Stencil</button>
  <button data-f="bubble">Bubble</button>
  <button data-f="wildstyle">Wildstyle</button>
  <button data-f="neon">Neón</button>
  <button data-f="tag">Tag</button>
</div>

<div id="loading" style="text-align:center;padding:20px">Cargando pared...</div>
<div id="pared"></div>
<div id="vacio" style="display:none;text-align:center;padding:40px">Todavía no hay graffitis. ¡Sé el primero!</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// --- PEGA ACA TUS KEYS REALES, LAS MISMAS QUE EN crear.html ---
const SUPABASE_URL = "https://ciwjyflatveowadenini.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNpd2p5ZmxhdHZlb3dhZGVuaW5pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU1MzE5ODAsImV4cCI6MjExMTEwNzk4MH0.wswRXCIhm5ZIMdtvncfssZO_y6wUigjgMmTMVYxA1ic";


const FUENTES = { stencil:'Black Ops One', bubble:'Titan One', wildstyle:'Black Ops One', neon:'Monoton', tag:'Permanent Marker' };
const FONDOS = { ladrillo:'#7a3b2e', hormigon:'#555', negro:'#000', chapa:'#2b4a6f' };
let todos = [];
let filtroActual = 'todos';

async function cargarPared(){
  const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const { data, error } = await client.from('graffitis').select('*').order('created_at', { ascending:false });
  document.getElementById('loading').style.display='none';
  if (error || !data) { document.getElementById('vacio').style.display='block'; return; }
  todos = data;
  dibujar();
}
function dibujar(){
  const pared = document.getElementById('pared');
  pared.innerHTML = '';
  const lista = todos.filter(g => filtroActual === 'todos' || g.estilo === filtroActual);
  if (lista.length === 0) { document.getElementById('vacio').style.display='block'; return; }
  document.getElementById('vacio').style.display='none';
  lista.forEach(g => {
    const a = document.createElement('a');
    a.className = 'card';
    a.href = `graffiti.html?id=${g.id}`;
    a.style.background = FONDOS[g.fondo] || '#222';
    a.style.color = g.color1;
    if (g.estilo === 'neon') a.style.textShadow = `0 0 15px ${g.color1}`;
    a.innerHTML = `<div class="card-texto" style="font-family:'${FUENTES[g.estilo]}',sans-serif">${g.texto}</div><div class="card-autor">por ${g.autor_alias} • ${g.estilo}</div>`;
    pared.appendChild(a);
  });
}
document.querySelectorAll('.filtros button').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('.filtros button').forEach(x => x.classList.remove('activo'));
    b.classList.add('activo');
    filtroActual = b.dataset.f;
    dibujar();
  };
});
cargarPared();
</script>
</body>
</html>
